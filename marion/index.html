<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le réglage de Marion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Une colonne guidée (Marion pose une question à la fois). Sur grand écran, l'aperçu du texte se construit à droite. */
:root {
  --bg: #F5F3FB;
  --surface: #FFFFFF;
  --ink: #1B2A41;
  --ink-soft: #4A5568;
  --line: #D9D3EE;
  --accent: #5B4B9E;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEEAF7;
  --ok: #2E7D32;
  --warn-bg: #FCEFE3;
  --warn-line: #C25E00;
  --font-display: "Avenir Next", "Avenir", "Segoe UI", system-ui, sans-serif;
  --font-body: "Calibri", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A26; --surface: #1B2636; --ink: #EDF0F6; --ink-soft: #B4BDCC; --line: #33405A;
    --accent: #A99DE6; --accent-ink: #141A26; --accent-soft: #262F45; --ok: #74C77A; --warn-bg: #3A2A1C; --warn-line: #E39A63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A26; --surface: #1B2636; --ink: #EDF0F6; --ink-soft: #B4BDCC; --line: #33405A;
  --accent: #A99DE6; --accent-ink: #141A26; --accent-soft: #262F45; --ok: #74C77A; --warn-bg: #3A2A1C; --warn-line: #E39A63;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 19px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
@media (min-width: 980px) { .wrap.with-preview { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } .preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(1.5rem, 3.5vw, 2.1rem); }
h2 { font-size: clamp(1.3rem, 2.8vw, 1.7rem); }
p { margin: 0; }
.head { display: flex; align-items: center; gap: 14px; }
.head img { width: 64px; height: 64px; flex: none; }
.step-label { font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.progress { display: flex; gap: 6px; margin-top: 6px; }
.progress span { width: 34px; height: 6px; border-radius: 3px; background: var(--line); }
.progress span.on { background: var(--accent); }

.main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.bubble { display: flex; gap: 12px; align-items: flex-start; }
.bubble img { width: 48px; height: 48px; flex: none; }
.bubble .say { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 14px 18px; font-size: 1.08rem; min-width: 0; }
.bubble .say b { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bubble .say { animation: in .35s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 700; }
.help { color: var(--ink-soft); font-size: .95rem; }
input[type="text"] { font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 54px; width: 100%; }
input[type="text"]::placeholder { color: var(--ink-soft); opacity: .8; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 999px; padding: 10px 18px; min-height: 50px; cursor: pointer; text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.counter { font-weight: 700; color: var(--accent); }
.warn { background: var(--warn-bg); border-left: 5px solid var(--warn-line); border-radius: 8px; padding: 12px 14px; font-size: .97rem; }
.nav { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; font-size: 1.05rem; min-height: 56px; padding: 12px 24px; border-radius: 12px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1 1 200px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.preview { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.preview pre, .block pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); font-size: 1rem; line-height: 1.55; background: var(--bg); border-radius: 10px; padding: 14px 16px; }
.preview .empty { color: var(--ink-soft); font-style: italic; }

/* carte finale */
.card { background: var(--accent-soft); border-radius: 18px; padding: 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.card img { width: 88px; height: 88px; flex: none; }
.card .who { min-width: 0; flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; }
.card .name { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; }
.card .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.card .tag { background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .95rem; font-weight: 700; color: var(--accent); }
.ready { color: var(--ok); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .card.anim { animation: pop .45s ease-out; } @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } } }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tools .chip { text-align: center; }
.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.block { display: flex; flex-direction: column; gap: 10px; }
.block .bh { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.status { font-weight: 700; color: var(--ok); min-height: 1.4em; }
.fallback { width: 100%; min-height: 120px; font: inherit; }
.tests { display: flex; flex-direction: column; gap: 8px; }
.tests div { background: var(--bg); border-radius: 10px; padding: 10px 14px; }
footer { color: var(--ink-soft); font-size: .9rem; max-width: 1180px; margin: 24px auto 0; }
</style>
</head>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

  var FONCTIONS = ["Maire", "Adjoint au maire", "Adjointe au maire", "Conseiller municipal", "Conseillère municipale"];
  var PUBLICS = ["les habitants de tous âges", "les membres des commissions", "le conseil municipal", "la presse", "les associations", "les agents de la ville"];
  var TONS = ["clair", "chaleureux", "direct", "factuel", "bienveillant", "solennel", "concis", "pédagogue", "rassurant", "engagé"];
  var EVITER = ["le jargon administratif", "les anglicismes", "les formules toutes faites comme « dans les meilleurs délais »", "les phrases trop longues", "un ton trop familier"];
  var TOOLS = {
    chatgpt: { name: "ChatGPT", two: true, steps: ["Touchez votre nom ou l'icône de profil.", "Ouvrez « Personnalisation ».", "Collez le bloc 1 dans le champ qui parle de vous, et le bloc 2 dans « Instructions personnalisées ».", "Enregistrez."] },
    claude: { name: "Claude", steps: ["Touchez vos initiales, puis « Paramètres ».", "Ouvrez la section des préférences de votre compte.", "Collez le texte dans le champ « Instructions ».", "Enregistrez."] },
    gemini: { name: "Gemini", steps: ["Ouvrez « Paramètres et aide ».", "Choisissez « Contexte personnel » (ou l'adresse gemini.google.com/saved-info).", "Touchez « Ajouter » et collez le texte.", "Validez."] },
    copilot: { name: "Copilot", steps: ["Ouvrez les « Paramètres ».", "Choisissez « Personnalisation ».", "Collez le texte dans « Instructions personnalisées ».", "Enregistrez."] },
    lechat: { name: "Le Chat", steps: ["Ouvrez une nouvelle conversation.", "Collez le texte comme premier message.", "Puis posez votre demande. À refaire à chaque nouvelle conversation."] }
  };

  function fresh() { return { fonction: "", commune: "Aix-en-Provence", delegation: "", publics: [], tons: [], tonAutre: "", eviter: [], eviterAutre: "", tool: "" }; }
  var a = load();
  var step = 0;
  var animateCard = false;

  function load() {
    var d = fresh();
    try {
      var v = JSON.parse(localStorage.getItem("reglage-marion") || "null");
      if (v) Object.keys(d).forEach(function (k) { if (v[k] !== undefined && typeof v[k] === typeof d[k] && Array.isArray(v[k]) === Array.isArray(d[k])) d[k] = v[k]; });
    } catch (e) {}
    return d;
  }
  function de(nom) { return /^[aeiouyhàâéèêîôûAEIOUYHÀÂÉÈÊÎÔÛ]/.test(nom) ? "d'" + nom : "de " + nom; }
  function save() { try { localStorage.setItem("reglage-marion", JSON.stringify(a)); } catch (e) {} }
  function list(arr) { if (!arr.length) return ""; if (arr.length === 1) return arr[0]; return arr.slice(0, -1).join(", ") + " et " + arr[arr.length - 1]; }
  function tons() { var t = a.tons.slice(); if (a.tonAutre.trim()) t.push(a.tonAutre.trim()); return t.slice(0, 3); }
  function eviter() { var e = a.eviter.slice(); if (a.eviterAutre.trim()) e.push(a.eviterAutre.trim()); return e; }

  function bloc1() {
    var l = [];
    if (a.fonction || a.delegation) {
      var f = a.fonction ? (a.fonction === "Maire" ? "le maire" : a.fonction.charAt(0).toLowerCase() + a.fonction.slice(1)) : "élu(e)";
      l.push("Je suis " + f + (a.commune.trim() ? " " + de(a.commune.trim()) : "") + ".");
      if (a.delegation.trim()) l.push("Ma délégation : " + a.delegation.trim() + ".");
    }
    if (a.publics.length) l.push("J'écris surtout pour " + list(a.publics) + ".");
    return l.join("\n");
  }
  function bloc2() {
    var l = [], t = tons(), e = eviter();
    if (t.length) l.push("Ton : " + list(t) + ".");
    if (e.length) l.push("À éviter : " + list(e) + ".");
    l.push("Réponds en français, avec des phrases courtes, faciles à lire et à dire à voix haute.");
    l.push("N'invente jamais de chiffre, de nom, de date ni de référence juridique. Si une information manque, écris [À VÉRIFIER].");
    l.push("Quand je te donne des documents, appuie-toi uniquement sur eux et indique d'où vient chaque information.");
    l.push("Ne prends aucun engagement au nom de la commune : ni délai, ni montant, ni décision.");
    l.push("Tes textes sont des propositions : je les relis et je les réécris avant de les utiliser.");
    return l.join("\n");
  }
  function full() {
    var b1 = bloc1();
    return (b1 ? "À propos de moi\n" + b1 + "\n\n" : "") + "Comment me répondre\n" + bloc2();
  }

  var STEPS = [
    { label: "Bienvenue", say: "Bonjour, je suis <b>Marion</b>. En <b>4 questions</b>, je prépare le texte qui règle votre assistant une fois pour toutes. Ensuite, chaque demande sera plus courte, et les garde-fous seront déjà en place.", render: renderIntro, ok: function () { return true; } },
    { label: "Question 1 sur 4", say: "<b>Qui êtes-vous ?</b> Votre assistant écrira en tenant compte de votre fonction et de votre délégation.", render: renderQui, ok: function () { return a.fonction && a.delegation.trim(); } },
    { label: "Question 2 sur 4", say: "<b>Pour qui écrivez-vous</b> le plus souvent ? Choisissez autant de réponses que vous voulez.", render: renderPublics, ok: function () { return a.publics.length > 0; } },
    { label: "Question 3 sur 4", say: "<b>Votre ton</b>, en 3 mots. Choisissez ceux qui vous ressemblent.", render: renderTon, ok: function () { return tons().length > 0; } },
    { label: "Question 4 sur 4", say: "<b>Ce que vous n'employez jamais.</b> Votre assistant l'évitera pour vous.", render: renderEviter, ok: function () { return true; } },
    { label: "C'est prêt", say: "<b>Votre assistant sur mesure est prêt.</b> Choisissez l'outil que vous utilisez : je vous montre où coller le texte.", render: renderResult, ok: function () { return true; } }
  ];

  function chipsHTML(name, options, selected, max) {
    return '<div class="chips" role="group">' + options.map(function (o) {
      var on = Array.isArray(selected) ? selected.indexOf(o) >= 0 : selected === o;
      var dis = max && !on && selected.length >= max ? " disabled" : "";
      return '<button type="button" class="chip" data-name="' + name + '" data-val="' + esc(o) + '" aria-pressed="' + on + '"' + dis + ">" + esc(o) + "</button>";
    }).join("") + "</div>";
  }
  function navHTML(nextLabel) {
    var s = STEPS[step];
    return '<div class="nav">' + (step > 0 ? '<button type="button" class="btn" id="prev">Précédent</button>' : "") +
      '<button type="button" class="btn primary" id="next"' + (s.ok() ? "" : " disabled") + ">" + (nextLabel || "Suivant") + "</button></div>";
  }

  function renderIntro() {
    return '<p>Vous obtiendrez un texte prêt à coller dans les réglages de ChatGPT, Claude, Gemini, Copilot ou Le Chat.</p>' +
      '<div class="warn">Ce réglage parle de vous. N\'y mettez rien sur des habitants.</div>' + navHTML("Commencer");
  }
  function renderQui() {
    return '<div class="field"><span class="lbl">Votre fonction</span>' + chipsHTML("fonction", FONCTIONS, a.fonction) + "</div>" +
      '<div class="field"><label for="commune">Votre commune</label><input type="text" id="commune" data-k="commune" value="' + esc(a.commune) + '"></div>' +
      '<div class="field"><label for="delegation">Votre délégation</label><input type="text" id="delegation" data-k="delegation" placeholder="Ex. : la sécurité" value="' + esc(a.delegation) + '"></div>' + navHTML();
  }
  function renderPublics() { return '<div class="field">' + chipsHTML("publics", PUBLICS, a.publics) + "</div>" + navHTML(); }
  function renderTon() {
    return '<div class="field"><span class="lbl">Vos 3 mots <span class="counter" id="tonCount">' + tons().length + ' sur 3</span></span>' + chipsHTML("tons", TONS, a.tons, a.tonAutre.trim() ? 2 : 3) + "</div>" +
      '<div class="field"><label for="tonAutre">Un autre mot ?</label><input type="text" id="tonAutre" data-k="tonAutre" placeholder="Ex. : enthousiaste" value="' + esc(a.tonAutre) + '"></div>' + navHTML();
  }
  function renderEviter() {
    return '<div class="field">' + chipsHTML("eviter", EVITER, a.eviter) + "</div>" +
      '<div class="field"><label for="eviterAutre">Une expression à vous ?</label><input type="text" id="eviterAutre" data-k="eviterAutre" placeholder="Ex. : « il convient de »" value="' + esc(a.eviterAutre) + '"></div>' + navHTML("Voir mon réglage");
  }

  function blockHTML(id, title, text) {
    return '<div class="block"><div class="bh"><span class="lbl"><b>' + esc(title) + '</b></span><button type="button" class="btn primary" data-copy="' + id + '">Copier</button></div><pre id="' + id + '">' + esc(text) + "</pre></div>";
  }

  function render() {
    var s = STEPS[step];
    $("stepLabel").textContent = s.label;
    $("say").innerHTML = s.say;
    $("panel").innerHTML = s.render();
    Array.prototype.forEach.call($("progress").children, function (el, i) { el.classList.toggle("on", i < step || (step === 5)); });
    var showPrev = step >= 1 && step <= 4;
    $("preview").hidden = !showPrev;
    $("wrap").classList.toggle("with-preview", showPrev);
    renderPreview();
  }
  function renderPreview() {
    if ($("preview").hidden) return;
    $("previewText").textContent = full();
  }
  function refreshNav() {
    var n = $("next"); if (n) n.disabled = !STEPS[step].ok();
    var c = $("tonCount"); if (c) c.textContent = tons().length + " sur 3";
    renderPreview();
  }

  $("panel").addEventListener("submit", function (e) { e.preventDefault(); });
  $("panel").addEventListener("input", function (e) {
    var k = e.target.dataset.k; if (!k) return;
    a[k] = e.target.value; save();
    if (k === "tonAutre") {
      var max = a.tonAutre.trim() ? 2 : 3;
      if (a.tons.length > max) { a.tons = a.tons.slice(0, max); save(); render(); var i = $("tonAutre"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
      Array.prototype.forEach.call(document.querySelectorAll('[data-name="tons"]'), function (b) { b.disabled = b.getAttribute("aria-pressed") !== "true" && a.tons.length >= max; });
    }
    refreshNav();
  });
  $("panel").addEventListener("click", function (e) {
    var c = e.target.closest("[data-name]");
    if (c) {
      var name = c.dataset.name, v = c.dataset.val;
      if (name === "fonction" || name === "tool") a[name] = v;
      else { var arr = a[name], i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
      save();
      if (name === "tool") { render(); return; }
      if (name === "fonction") Array.prototype.forEach.call(document.querySelectorAll('[data-name="fonction"]'), function (b) { b.setAttribute("aria-pressed", String(b.dataset.val === a.fonction)); });
      else if (name === "tons") { var max = a.tonAutre.trim() ? 2 : 3; Array.prototype.forEach.call(document.querySelectorAll('[data-name="tons"]'), function (b) { var on = a.tons.indexOf(b.dataset.val) >= 0; b.setAttribute("aria-pressed", String(on)); b.disabled = !on && a.tons.length >= max; }); }
      else c.setAttribute("aria-pressed", String(a[name].indexOf(v) >= 0));
      refreshNav(); return;
    }
    if (e.target.id === "next" && STEPS[step].ok()) { step = Math.min(step + 1, STEPS.length - 1); animateCard = step === 5; render(); animateCard = false; window.scrollTo(0, 0); return; }
    if (e.target.id === "prev") { step = step === 5 ? 1 : Math.max(0, step - 1); render(); return; }
    if (e.target.id === "reset") { a = fresh(); save(); step = 0; render(); return; }
    var cp = e.target.closest("[data-copy]");
    if (cp) {
      var text = $(cp.dataset.copy).textContent;
      var done = function () { $("status").textContent = "Texte copié. Collez-le dans votre assistant."; $("fallback").hidden = true; };
      var fail = function () { var f = $("fallback"); f.value = text; f.hidden = false; f.focus(); f.select(); $("status").textContent = "Copie automatique impossible : le texte est sélectionné ci-dessous, utilisez « Copier » de votre appareil."; };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail); else fail(); } catch (err) { fail(); }
    }
  });

  render();
